<!DOCTYPE html>
<html>
<head>
    <title>Cricket Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        button {
            background: #ff6b00;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #e65c00;
        }
    </style>
</head>

<body>

<h1>🏏 Cricket Merchandise Store</h1>

<div class="container">

    {% for product in products %}
    <div class="card">
        <h3>{{ product.name }}</h3>
        <img src="{{ url_for('static', filename='images/' + product.image) }}">
        <div class="price">₹{{ product.price }}</div>
        <button>Add to Cart</button>
    </div>
    {% endfor %}

</div>

</body>
</html>
