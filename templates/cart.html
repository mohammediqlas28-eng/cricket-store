<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body style="text-align:center; font-family:Arial;">

<h2>🛒 Your Cart</h2>

{% for item in items %}
    <p>{{ item.name }} - ₹{{ item.price }}</p>
{% endfor %}

<h3>Total: ₹{{ total }}</h3>

<button onclick="alert('Payment Successful!')">Checkout</button>

<br><br>
<a href="/">⬅ Back to Home</a>

</body>
</html>
