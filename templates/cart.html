<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>🛒 Your Cart</h1>

<a href="/">Back to Store</a>
<hr>

{% for item in items %}
    <h3>{{ item.name }}</h3>
    <img src="{{ url_for('static', filename='images/' + item.image) }}" width="120">
    <p>₹{{ item.price }}</p>
    <hr>
{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<a href="/checkout">
    <button>Checkout</button>
</a>

</body>
</html>
