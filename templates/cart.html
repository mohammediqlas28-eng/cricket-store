<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h2>Your Cart</h2>

{% for item in items %}
    <p>{{ item.name }} - ₹{{ item.price }}</p>
{% endfor %}

<h3>Total: ₹{{ total }}</h3>

<br>
<a href="/checkout">
    <button>Checkout</button>
</a>

<br><br>
<a href="/">⬅ Back to Shop</a>

</body>
</html>
